<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel — Sakura Guitars</title><link rel="stylesheet" href="/style.css"></head><body><main><span class="eyebrow">SAKURA GUITARS • ADMIN</span><h1>Catálogo e dropshipping</h1><p style="color:#716a70">Cadastre produtos, preço de venda, custo, fornecedor e variações. O custo é privado e não aparece para clientes.</p><form id="form" style="max-width:760px;background:#fff;padding:25px;border:1px solid #eadde3;border-radius:10px"><input name="name" placeholder="Nome do produto" required><input name="price" type="number" step=".01" placeholder="Preço de venda" required><input name="cost" type="number" step=".01" placeholder="Custo no fornecedor"><input name="stock" type="number" placeholder="Estoque" required><input name="category" placeholder="Categoria"><input name="sku" placeholder="SKU"><input name="supplier" placeholder="Fornecedor"><input name="supplierUrl" placeholder="URL do produto no fornecedor"><input name="image" placeholder="URL da imagem principal"><input name="variations" placeholder="Variações separadas por vírgula (ex.: Preto, Branco)"><input name="shipping" placeholder="Informação de envio"><textarea name="description" placeholder="Descrição"></textarea><button class="btn">Cadastrar produto</button></form><div id="list" style="margin-top:30px"></div></main><style>input,textarea{display:block;width:100%;padding:13px;margin:9px 0;border:1px solid #eadde3;border-radius:7px;background:white}textarea{min-height:110px}</style><script>
const pass=prompt("Senha do administrador:");async function load(){let p=await fetch("/api/products").then(r=>r.json());list.innerHTML=p.map(x=>`<div style="background:#fff;border:1px solid #eadde3;padding:16px;margin:8px 0;border-radius:8px"><b>${x.name}</b><br>Venda: R$ ${Number(x.price).toFixed(2)} • Custo: R$ ${Number(x.cost||0).toFixed(2)} • Estoque: ${x.stock}<button onclick="del('${x.id}')" style="float:right">Excluir</button></div>`).join("")}
form.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(form));d.price=Number(d.price);d.cost=Number(d.cost||0);d.stock=Number(d.stock);d.variations=(d.variations||"").split(",").map(x=>x.trim()).filter(Boolean);let r=await fetch("/api/products",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":pass},body:JSON.stringify(d)});if(!r.ok)return alert("Senha incorreta ou erro");form.reset();load()};async function del(id){if(confirm("Excluir?")){await fetch("/api/products/"+id,{method:"DELETE",headers:{"x-admin-password":pass}});load()}}load();
</script></body></html>
